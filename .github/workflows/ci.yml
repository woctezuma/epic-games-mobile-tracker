name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt -r requirements-dev.txt
        pip install ruff mypy types-requests

    - name: Ruff check
      run: |
        ruff check --target-version py313 --select ALL --ignore A004,C901,CPY001,D,DOC,E501,ERA001,INP001,PLR091,PLR2004,RUF001,S101,T201 .

    - name: Ruff format check
      run: ruff format --check .

    - name: Mypy
      run: mypy .

    - name: Run tests
      run: pytest -q
